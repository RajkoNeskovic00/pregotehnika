privacy:
    title: "Politika privatnosti | Pregotehnika"
    heading: "Politika privatnosti"
    updated: "Poslednje ažuriranje: Jul 2026."
    s1_heading: "1. Opšte informacije i rukovaoc"
    s1_text: "Pregotehnika poštuje privatnost svojih korisnika i posvećena je zaštiti ličnih podataka u skladu sa Zakonom o zaštiti podataka o ličnosti Republike Srbije. Rukovaoc vaših podataka je Pregotehnika d.o.o, sa sedištem na adresi Kneza Vase Popovića 39, Gornji Milanovac."
    s2_heading: "2. Podaci koje prikupljamo"
    s2_intro: "Putem našeg veb-sajta prikupljamo samo one podatke koje nam dobrovoljno dostavite:"
    s2_li1: "Ime i prezime"
    s2_li2: "Email adresa"
    s2_li3: "Broj telefona"
    s2_li4: "Sadržaj poruke poslate putem kontakt forme"
    s3_heading: "3. Svrha i pravni osnov obrade"
    s3_intro: "Vaše podatke obrađujemo isključivo u sledeće svrhe:"
    s3_li1: "Odgovaranje na vaše upite poslate preko kontakt forme (Pravni osnov: pristanak korisnika)."
    s3_li2: "Priprema ponuda i preduzimanje radnji na vaš zahtev pre zaključenja ugovora (Pravni osnov: izvršenje ugovora ili priprema za ugovor)."
    s4_heading: "4. Rok čuvanja podataka"
    s4_text: "Podatke koje nam dostavite preko kontakt forme čuvamo samo onoliko koliko je potrebno da bismo odgovorili na vaš upit ili ispunili svrhu zbog koje su prikupljeni, odnosno do povlačenja vašeg pristanka. Nakon toga, podaci se trajno brišu."
    s5_heading: "5. Deljenje podataka sa trećim licima"
    s5_text: "Pregotehnika ne prodaje, ne iznajmljuje niti deli vaše lične podatke sa trećim licima, osim u slučajevima kada je to naša zakonska obaveza ili kada je neophodno za tehničko održavanje ovog veb-sajta (hosting provajder)."
    s6_heading: "6. Vaša prava u vezi sa podacima"
    s6_intro: "U svakom trenutku imate sledeća prava u vezi sa vašim ličnim podacima:"
    s6_li1: "<strong>Pravo na pristup:</strong> Možete tražiti potvrdu da li obrađujemo vaše podatke i kopiju tih podataka."
    s6_li2: "<strong>Pravo na ispravku:</strong> Možete zahtevati ispravku netačnih ili dopunu nepotpunih podataka."
    s6_li3: "<strong>Pravo na brisanje:</strong> Možete tražiti da obrišemo vaše podatke (pravo na zaborav)."
    s6_li4: "<strong>Pravo na povlačenje pristanka:</strong> U svakom trenutku možete povući pristanak za obradu, nakon čega ćemo prestati sa obradom."
    s6_outro: "Sva prava možete ostvariti slanjem zahteva na našu email adresu."
    s7_heading: "7. Sigurnost podataka"
    s7_text: "Primenjujemo odgovarajuće tehničke i organizacione mere kako bismo osigurali visok nivo bezbednosti vaših podataka i sprečili neovlašćeni pristup, gubitak ili zloupotrebu (uključujući upotrebu SSL sertifikata na sajtu)."
    s8_heading: "8. Kolačići (Cookies)"
    s8_text: "Naš sajt koristi kolačiće kako bi obezbedio pravilno funkcionisanje stranica. Ne koristimo napredne kolačiće za praćenje i profilisanje bez vašeg eksplicitnog pristanka. Kolačiće možete isključiti u podešavanjima vašeg internet pretraživača."
    s9_heading: "9. Kontakt"
    s9_text: "Za sva pitanja, zahteve ili ostvarivanje vaših prava u vezi sa zaštitom podataka, možete nam se obratiti na:"
