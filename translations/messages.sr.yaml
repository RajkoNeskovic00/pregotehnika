    cta_more: "SAZNAJTE VIŠE →"
    info_title: "Gravirani valjci za savremenu industriju"
    info_p1: "Glavni fokus kompanije je proizvodnja i graviranje <strong>čeličnih valjaka za utiskivanje</strong>, koji se koriste za utiskivanje tekstura u papir i druge materijale, čime se tim materijalima daju posebne tehničke karakteristike."
    info_p2: "Tržište <strong>tissue papira</strong> prolazi kroz stalnu evoluciju, jer se mnogi proizvođači odlučuju za proizvodnju toaletnog papira sa tri pa čak i četiri sloja, sve u cilju povećanja vrednosti proizvoda i isporuke kvalitetnijeg rešenja krajnjim kupcima."
    info_p3: "Naša tehnologija omogućava izradu graviranih površina koje odgovaraju zahtevima modernih proizvodnih procesa."
