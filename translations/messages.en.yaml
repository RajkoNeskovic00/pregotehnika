    hero_text: "Specialized in engraving metal rolls for the tissue paper, plastics and aluminium foil industries."
    cta_more: "LEARN MORE →"
    info_title: "Engraved rolls for modern industry"
    info_p1: "The company's main focus is the production and engraving of <strong>steel embossing rolls</strong> used to emboss textures into paper and other materials, giving those materials special technical characteristics."
    info_p2: "The <strong>tissue paper</strong> market is constantly evolving, as many manufacturers choose to produce toilet paper with three or even four plies, aiming to increase product value and deliver a higher-quality solution to end customers."
    info_p3: "Our technology enables engraved surfaces that meet the requirements of modern production processes."
