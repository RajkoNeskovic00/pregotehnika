privacy:
    title: "Privacy policy | Pregotehnika"
    heading: "Privacy policy"
    updated: "Last updated: July 2026."
    s1_heading: "1. General information and controller"
    s1_text: "Pregotehnika respects the privacy of its users and is committed to protecting personal data in accordance with the Personal Data Protection Act of the Republic of Serbia. The controller of your data is Pregotehnika d.o.o, located at Kneza Vase Popovića 39, Gornji Milanovac."
    s2_heading: "2. Data we collect"
    s2_intro: "Through our website we collect only the data you voluntarily provide:"
    s2_li1: "Full name"
    s2_li2: "Email address"
    s2_li3: "Phone number"
    s2_li4: "Content of the message sent via the contact form"
    s3_heading: "3. Purpose and legal basis of processing"
    s3_intro: "We process your data exclusively for the following purposes:"
    s3_li1: "Responding to inquiries submitted via the contact form (Legal basis: user consent)."
    s3_li2: "Preparing offers and taking steps at your request prior to entering into a contract (Legal basis: performance of a contract or steps prior to a contract)."
    s4_heading: "4. Data retention period"
    s4_text: "Data you provide via the contact form is kept only as long as necessary to respond to your inquiry or fulfil the purpose for which it was collected, or until you withdraw your consent. After that, the data is permanently deleted."
    s5_heading: "5. Sharing data with third parties"
    s5_text: "Pregotehnika does not sell, rent or share your personal data with third parties, except where required by law or necessary for the technical maintenance of this website (hosting provider)."
    s6_heading: "6. Your rights regarding personal data"
    s6_intro: "You have the following rights regarding your personal data at any time:"
    s6_li1: "<strong>Right of access:</strong> You may request confirmation of whether we process your data and a copy of that data."
    s6_li2: "<strong>Right to rectification:</strong> You may request correction of inaccurate or incomplete data."
    s6_li3: "<strong>Right to erasure:</strong> You may request that we delete your data (right to be forgotten)."
    s6_li4: "<strong>Right to withdraw consent:</strong> You may withdraw consent to processing at any time, after which we will stop processing."
    s6_outro: "You can exercise all rights by sending a request to our email address."
    s7_heading: "7. Data security"
    s7_text: "We apply appropriate technical and organisational measures to ensure a high level of security for your data and to prevent unauthorised access, loss or misuse (including the use of SSL certificates on the site)."
    s8_heading: "8. Cookies"
    s8_text: "Our site uses cookies to ensure pages function correctly. We do not use advanced tracking and profiling cookies without your explicit consent. You can disable cookies in your browser settings."
    s9_heading: "9. Contact"
    s9_text: "For any questions, requests or to exercise your rights regarding data protection, you can contact us at:"
