about:
    title: "O nama | Pregotehnika"
    heading: "O nama"
    subtitle: "Preciznost, iskustvo i pouzdana industrijska rešenja"
    company_heading: "Pregotehnika"
    company_text: "<strong>Pregotehnika</strong> je uskospecijalizovana kompanija sa više od <span class=\"highlight\">tri decenije iskustva</span> u projektovanju i izradi <strong>graviranih valjaka</strong> za različite industrijske primene. U zavisnosti od tehnoloških zahteva kupaca izrađujemo <span class=\"highlight\">pojedinačne gravirane valjke</span> i kompletne sklopove namenjene papirnoj industriji, industriji prerade plastičnih materijala, proizvodnji ambalaže od aluminijumskih folija, kao i auto-industriji."
    stat_founded: "Godina osnivanja"
    stat_experience: "Godina iskustva"
    stat_quality: "Posvećenost kvalitetu"
    tech_heading: "Tehnologija i kvalitet"
    tech_text: "Primena <strong>savremenih tehnologija</strong> i tradicionalnih tehnika graviranja omogućava izradu površinskih struktura visokog kvaliteta. Svakom projektu pristupamo <span class=\"highlight\">individualno i precizno</span>, sa ciljem da ponudimo pouzdano i dugotrajno rešenje prilagođeno zahtevima svakog proizvodnog procesa."
    tissue_heading: "Kompletne sklopove za preradu tissue papira"
    tissue_text: "Pored proizvodnje graviranih valjaka, projektujemo, izrađujemo i montiramo <strong>kompletne linije za preradu toalet papira</strong>. Naša rešenja obuhvataju kompletan proces: <span class=\"highlight\">razvoj, proizvodnju, montažu i puštanje opreme u rad.</span>"
    partner_heading: "Pouzdan partner industrije"
    partner_text: "Naši proizvodi i tehnološka rešenja koriste se kod kupaca u zemlji i inostranstvu. Prepoznati smo po <strong>kvalitetu izrade, preciznosti i dugom radnom veku</strong>. Dugogodišnje iskustvo i posvećenost svakom projektu čine nas pouzdanim partnerom u unapređenju proizvodnih procesa."
    gallery_heading: "Naši proizvodi i proizvodnja"
    lightbox_close: "Zatvori"
    lightbox_prev: "Prethodna"
    lightbox_next: "Sledeća"

