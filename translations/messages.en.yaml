about:
    title: "About us | Pregotehnika"
    heading: "About us"
    subtitle: "Precision, experience and reliable industrial solutions"
    company_heading: "Pregotehnika"
    company_text: "<strong>Pregotehnika</strong> is a highly specialized company with more than <span class=\"highlight\">three decades of experience</span> in designing and manufacturing <strong>engraved rolls</strong> for various industrial applications. Depending on customers' technological requirements, we produce <span class=\"highlight\">individual engraved rolls</span> and complete assemblies for the paper industry, plastics processing, aluminium foil packaging, and the automotive industry."
    stat_founded: "Year founded"
    stat_experience: "Years of experience"
    stat_quality: "Commitment to quality"
    tech_heading: "Technology and quality"
    tech_text: "The use of <strong>modern technologies</strong> and traditional engraving techniques enables high-quality surface structures. We approach every project <span class=\"highlight\">individually and precisely</span>, aiming to offer a reliable, long-lasting solution tailored to each production process."
    tissue_heading: "Complete assemblies for tissue paper processing"
    tissue_text: "In addition to engraved rolls, we design, manufacture and install <strong>complete toilet paper converting lines</strong>. Our solutions cover the full process: <span class=\"highlight\">development, production, installation and commissioning.</span>"
    partner_heading: "A reliable industry partner"
    partner_text: "Our products and technological solutions are used by customers in Serbia and abroad. We are recognized for <strong>manufacturing quality, precision and long service life</strong>. Years of experience and dedication to every project make us a reliable partner in improving production processes."
    gallery_heading: "Our products and production"
